name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Telegram/SourceFiles/platform/ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Initialize submodules
      run: |
        echo "Initializing submodules..."
        git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${{ secrets.GITHUB_TOKEN }}"
        git submodule sync --recursive
        git submodule update --init --recursive --depth 1
        echo "Submodules initialized"
        
    - name: List submodules
      run: |
        echo "Checking submodule status:"
        git submodule status
        echo ""
        echo "Checking if cmake submodule exists:"
        if [ -d "cmake" ]; then
          echo "cmake directory exists"
          ls -la cmake/ | head -10
          if [ -f "cmake/validate_special_target.cmake" ]; then
            echo "SUCCESS: cmake submodule is properly initialized!"
          else
            echo "WARNING: cmake/validate_special_target.cmake not found"
            echo "Trying to fetch cmake submodule manually..."
            cd cmake || exit 1
            git fetch --depth 1 || true
            git checkout HEAD || true
            cd ..
            if [ -f "cmake/validate_special_target.cmake" ]; then
              echo "SUCCESS: cmake submodule fixed!"
            else
              echo "ERROR: cmake submodule still not working"
              exit 1
            fi
          fi
        else
          echo "ERROR: cmake directory does not exist!"
          echo "Trying to initialize cmake submodule manually..."
          git submodule update --init --recursive cmake || exit 1
          if [ ! -d "cmake" ]; then
            echo "ERROR: Failed to initialize cmake submodule!"
            exit 1
          fi
        fi
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install dependencies
      run: |
        brew install cmake
        # Add other dependencies as needed
        
    - name: Show environment info
      run: |
        echo "Xcode version:"
        xcodebuild -version
        echo "CMake version:"
        cmake --version
        echo "Current directory:"
        pwd
        
    - name: Verify submodules
      run: |
        echo "Verifying cmake submodule:"
        if [ ! -d "cmake" ]; then
          echo "ERROR: cmake directory does not exist!"
          echo "Trying to initialize cmake submodule manually..."
          git submodule update --init --recursive cmake || true
        fi
        if [ -d "cmake" ]; then
          echo "cmake directory exists, listing contents:"
          ls -la cmake/ | head -20
          if [ -f "cmake/validate_special_target.cmake" ]; then
            echo "SUCCESS: cmake submodule is properly initialized!"
          else
            echo "WARNING: cmake/validate_special_target.cmake not found, but directory exists"
            echo "Contents of cmake/:"
            find cmake -type f -name "*.cmake" | head -10
          fi
        else
          echo "ERROR: cmake submodule still not initialized after manual attempt!"
          exit 1
        fi
        
    - name: Configure CMake for iOS
      run: |
        echo "Configuring CMake for iOS from root directory..."
        echo "Current directory: $(pwd)"
        cmake -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DCMAKE_BUILD_TYPE=Release \
              -B build-ios \
              -S . 2>&1 | tee cmake-config.log || (echo "CMake configuration failed. Log:"; cat cmake-config.log; exit 1)
              
    - name: Build
      continue-on-error: true
      run: |
        echo "Building iOS project..."
        cmake --build build-ios --config Release -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log || (echo "Build failed. Last 100 lines of log:"; tail -100 build.log; exit 1)
        
    - name: Create IPA (if build succeeded)
      if: success()
      run: |
        echo "Looking for built app..."
        find build-ios -name "*.app" -type d | head -5
        # IPA creation would require code signing and packaging
        # This is a placeholder for future implementation
        
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          cmake-config.log
          build.log
        retention-days: 7
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: Telegram/build-ios/

