name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Telegram/SourceFiles/platform/ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        
    - name: Verify submodules
      run: |
        echo "Checking if cmake submodule exists:"
        ls -la cmake/ || echo "cmake/ directory not found"
        if [ -d "cmake" ] && [ -n "$(ls -A cmake)" ]; then
          echo "✓ cmake submodule is initialized"
          ls cmake/ | head -10
        else
          echo "✗ cmake submodule is empty or missing"
          echo "Attempting to initialize submodules manually..."
          git submodule update --init --recursive
        fi
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install dependencies
      run: |
        brew install cmake
        # Add other dependencies as needed
        
    - name: Show environment info
      run: |
        echo "Xcode version:"
        xcodebuild -version
        echo "CMake version:"
        cmake --version
        echo "Current directory:"
        pwd
        
    - name: Configure CMake for iOS
      run: |
        echo "Configuring CMake for iOS from root directory..."
        echo "Current directory: $(pwd)"
        echo "Listing files:"
        ls -la
        cmake -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -B build-ios \
              -S . 2>&1 | tee cmake-config.log || (echo "CMake configuration failed. Log:"; cat cmake-config.log; exit 1)
              
    - name: Build
      continue-on-error: true
      run: |
        echo "Building iOS project..."
        cmake --build build-ios --config Release 2>&1 | tee build.log || (echo "Build failed. Last 100 lines of log:"; tail -100 build.log; exit 1)
        
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          cmake-config.log
          build.log
        retention-days: 7
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: Telegram/build-ios/

