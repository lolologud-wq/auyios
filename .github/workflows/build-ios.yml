name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Telegram/SourceFiles/platform/ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0
        
    - name: Initialize submodules
      run: |
        echo "Initializing submodules..."
        echo "Current directory: $(pwd)"
        echo "Listing .gitmodules:"
        cat .gitmodules | grep -A 2 "cmake" || echo "cmake not found in .gitmodules"
        echo ""
        echo "Checking git submodule status before init:"
        git submodule status || echo "No submodules initialized yet"
        echo ""
        echo "Initializing all submodules (without depth limit)..."
        git submodule update --init --recursive --no-single-branch
        echo ""
        echo "Checking submodule status after init:"
        git submodule status
        echo ""
        echo "Checking if cmake directory exists:"
        if [ -d "cmake" ]; then
          echo "SUCCESS: cmake directory exists"
          ls -la cmake/ | head -10
          if [ -f "cmake/validate_special_target.cmake" ]; then
            echo "SUCCESS: cmake/validate_special_target.cmake found!"
          else
            echo "WARNING: cmake/validate_special_target.cmake not found"
            echo "Listing cmake directory contents:"
            find cmake -type f -name "*.cmake" | head -10
            echo ""
            echo "Trying to checkout cmake submodule to latest:"
            cd cmake && git fetch && git checkout $(git describe --tags --abbrev=0 2>/dev/null || git rev-parse HEAD) && cd ..
            if [ -f "cmake/validate_special_target.cmake" ]; then
              echo "SUCCESS: cmake submodule fixed!"
            fi
          fi
        else
          echo "ERROR: cmake directory does not exist!"
          echo "Checking git submodule foreach:"
          git submodule foreach 'echo $name: $path' || true
          echo ""
          echo "Trying to manually clone cmake submodule:"
          mkdir -p cmake
          git clone --depth 1 https://github.com/desktop-app/cmake_helpers.git cmake || exit 1
          if [ -f "cmake/validate_special_target.cmake" ]; then
            echo "SUCCESS: cmake submodule manually cloned!"
          else
            echo "ERROR: Still cannot get cmake submodule"
            exit 1
          fi
        fi
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install dependencies
      run: |
        brew install cmake
        # Add other dependencies as needed
        
    - name: Show environment info
      run: |
        echo "Xcode version:"
        xcodebuild -version
        echo "CMake version:"
        cmake --version
        echo "Current directory:"
        pwd
        
    - name: Verify submodules
      run: |
        echo "Final verification of cmake submodule:"
        if [ -d "cmake" ] && [ -f "cmake/validate_special_target.cmake" ]; then
          echo "SUCCESS: cmake submodule is properly initialized!"
          echo "cmake directory contents:"
          ls -la cmake/ | head -20
          echo ""
          echo "Checking for cmake/external directory:"
          if [ -d "cmake/external" ]; then
            echo "cmake/external exists"
            ls -la cmake/external/ | head -20
            if [ -d "cmake/external/ada" ]; then
              echo "cmake/external/ada exists"
              ls -la cmake/external/ada/
            else
              echo "WARNING: cmake/external/ada does not exist"
            fi
          else
            echo "WARNING: cmake/external does not exist"
          fi
        else
          echo "ERROR: cmake submodule verification failed!"
          if [ -d "cmake" ]; then
            echo "cmake directory exists but validate_special_target.cmake is missing"
            find cmake -type f | head -20
          else
            echo "cmake directory does not exist!"
          fi
          exit 1
        fi
        
    - name: Build ada library for iOS
      run: |
        echo "Building ada library for iOS..."
        ADA_VERSION="v3.2.4"
        ADA_BUILD_DIR="ada-build-ios"
        ADA_INSTALL_DIR="${PWD}/${ADA_BUILD_DIR}/install"
        echo "Cloning ada library..."
        git clone -b ${ADA_VERSION} --depth 1 https://github.com/ada-url/ada.git ada-source || exit 1
        cd ada-source
        echo "Installing ninja for cross-compilation..."
        brew install ninja || echo "ninja might already be installed"
        echo "Configuring ada for iOS with Ninja..."
        cmake -B build \
              -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_C_COMPILER=$(xcrun --find --sdk iphoneos clang) \
              -DCMAKE_CXX_COMPILER=$(xcrun --find --sdk iphoneos clang++) \
              -DCMAKE_C_FLAGS="-arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path)" \
              -DCMAKE_CXX_FLAGS="-arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path)" \
              -DADA_TESTING=OFF \
              -DADA_TOOLS=OFF \
              -DADA_INCLUDE_URL_PATTERN=OFF \
              -DCMAKE_INSTALL_PREFIX="${ADA_INSTALL_DIR}" \
              -DCMAKE_BUILD_TYPE=Release || exit 1
        echo "Building ada..."
        cmake --build build || exit 1
        echo "Installing ada..."
        cmake --install build || exit 1
        cd ..
        echo "ada library built and installed to: ${ADA_INSTALL_DIR}"
        echo "Checking installed files:"
        ls -la "${ADA_INSTALL_DIR}/lib/cmake/ada/" || echo "ada cmake files not found"
        echo "Setting CMAKE_PREFIX_PATH and ada_DIR..."
        export CMAKE_PREFIX_PATH="${ADA_INSTALL_DIR}:${CMAKE_PREFIX_PATH}"
        export ada_DIR="${ADA_INSTALL_DIR}/lib/cmake/ada"
        echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> $GITHUB_ENV
        echo "ada_DIR=${ada_DIR}" >> $GITHUB_ENV
        
    - name: Build Boost library for iOS
      timeout-minutes: 60
      run: |
        echo "Building Boost library for iOS..."
        BOOST_VERSION="1.84.0"
        BOOST_BUILD_DIR="boost-build-ios"
        BOOST_INSTALL_DIR="${PWD}/${BOOST_BUILD_DIR}/install"
        IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "iOS SDK path: ${IOS_SDK_PATH}"
        echo "Downloading Boost..."
        curl -L https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2 -o boost.tar.bz2 || exit 1
        echo "Extracting Boost..."
        tar -xjf boost.tar.bz2 || exit 1
        cd boost_${BOOST_VERSION//./_}
        echo "Configuring Boost for iOS..."
        ./bootstrap.sh --prefix="${BOOST_INSTALL_DIR}" || exit 1
        echo "Building Boost for iOS (this may take 20-30 minutes)..."
        echo "Creating user-config.jam for iOS..."
        IOS_CLANG=$(xcrun --find --sdk iphoneos clang++)
        IOS_AR=$(xcrun --find --sdk iphoneos ar)
        IOS_RANLIB=$(xcrun --find --sdk iphoneos ranlib)
        {
          echo "using clang : ios : ${IOS_CLANG} :"
          echo "    <archiver>${IOS_AR}"
          echo "    <ranlib>${IOS_RANLIB}"
          echo "    <compileflags>-arch arm64 -isysroot ${IOS_SDK_PATH} -miphoneos-version-min=13.0 -std=c++17"
          echo "    <linkflags>-arch arm64 -isysroot ${IOS_SDK_PATH} -miphoneos-version-min=13.0"
          echo "    ;"
        } > user-config.jam
        ./b2 toolset=clang-ios \
            variant=release \
            link=static \
            threading=multi \
            --prefix="${BOOST_INSTALL_DIR}" \
            --user-config=user-config.jam \
            --with-filesystem \
            --with-system \
            --with-thread \
            --with-chrono \
            --with-date_time \
            --with-regex \
            install || exit 1
        cd ..
        echo "Boost library built and installed to: ${BOOST_INSTALL_DIR}"
        echo "Setting CMAKE_PREFIX_PATH to include Boost..."
        export CMAKE_PREFIX_PATH="${BOOST_INSTALL_DIR}:${CMAKE_PREFIX_PATH}"
        echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> $GITHUB_ENV
        
    - name: Configure CMake for iOS
      run: |
        echo "Configuring CMake for iOS from root directory..."
        echo "Current directory: $(pwd)"
        echo "Checking if cmake directory exists:"
        ls -la cmake/ | head -5
        echo ""
        echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
        echo "ada_DIR=${ada_DIR}"
        echo ""
        echo "Configuring CMake with Xcode generator for iOS..."
        cmake -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
              -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="" \
              -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=13.0 \
              -DCMAKE_XCODE_ATTRIBUTE_SDKROOT=iphoneos \
              -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
              -Dada_DIR="${ada_DIR}" \
              -B build-ios \
              -S . 2>&1 | tee cmake-config.log || (echo "CMake configuration failed. Log:"; cat cmake-config.log; exit 1)
        echo ""
        echo "CMake configuration completed. Checking build directory:"
        ls -la build-ios/ | head -10
        echo ""
        echo "Checking for Xcode project file:"
        find build-ios -name "*.xcodeproj" -o -name "*.xcworkspace" | head -5
              
    - name: Build
      continue-on-error: true
      run: |
        echo "Building iOS project..."
        echo "Checking build directory structure:"
        ls -la build-ios/ | head -20
        echo ""
        echo "Finding all Xcode projects:"
        find build-ios -name "*.xcodeproj" -type d | head -10
        echo ""
        echo "Finding main Telegram Xcode project:"
        MAIN_PROJ=$(find build-ios -name "Telegram.xcodeproj" -type d | head -1)
        if [ -z "$MAIN_PROJ" ]; then
          echo "Telegram.xcodeproj not found, looking for any .xcodeproj in root..."
          MAIN_PROJ=$(find build-ios -maxdepth 2 -name "*.xcodeproj" -type d | grep -v "CMakeFiles" | head -1)
        fi
        echo ""
        if [ -n "$MAIN_PROJ" ]; then
          echo "Found main project: $MAIN_PROJ"
          echo "Listing available schemes:"
          xcodebuild -project "$MAIN_PROJ" -list || echo "Could not list schemes"
          echo ""
          echo "Building with cmake --build (recommended for CMake-generated projects)..."
          cmake --build build-ios --config Release -- -jobs $(sysctl -n hw.ncpu) 2>&1 | tee build.log || (echo "Build failed. Last 100 lines of log:"; tail -100 build.log; exit 1)
        else
          echo "No main Xcode project found, using cmake --build directly..."
          cmake --build build-ios --config Release -- -jobs $(sysctl -n hw.ncpu) 2>&1 | tee build.log || (echo "Build failed. Last 100 lines of log:"; tail -100 build.log; exit 1)
        fi
        
    - name: Create IPA (if build succeeded)
      if: success()
      run: |
        echo "Looking for built app..."
        find build-ios -name "*.app" -type d | head -5
        # IPA creation would require code signing and packaging
        # This is a placeholder for future implementation
        
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          cmake-config.log
          build.log
        retention-days: 7
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: Telegram/build-ios/
